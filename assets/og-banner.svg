    <circle cx="293" cy="27" r="7" fill="#10b981"/>
    <text x="313" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">SERVICE UPTIME</text>
    <text x="313" y="42" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" font-weight="700">100% Online</text>

    <!-- Badge 3: Contributions -->
    <rect x="530" y="0" width="265" height="54" rx="14" fill="#161f33" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="558" cy="27" r="7" fill="#38bdf8"/>
    <text x="578" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600">YEARLY COMMITS</text>
    <text x="578" y="42" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" font-weight="700">1972+ Verified</text>

    <!-- Right Author Tag -->
    <rect x="815" y="0" width="217" height="54" rx="14" fill="#161f33" stroke="#1e293b" stroke-width="1.5"/>
    <text x="923" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600">MAINTAINED BY</text>
    <text x="923" y="42" text-anchor="middle" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="700">@AndyMagwayer</text>
  </g>
